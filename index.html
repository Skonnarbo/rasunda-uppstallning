<style>
:root{--navy:#0a1f4d;--navy2:#06122e;--acc:#4a8cff;--bg:#eef2f8;--card:#fff;--tx:#122;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px -apple-system,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
header{background:linear-gradient(var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
header b{font-size:20px}header img{width:50px;height:50px}
nav{display:flex;background:var(--navy2)}nav button{flex:1;padding:14px 4px;background:none;border:0;border-bottom:3px solid transparent;color:#9db4e6;font-size:16px}
nav button.on{color:#fff;border-color:var(--acc)}
main{padding:14px;max-width:1100px;margin:auto}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
h2{margin:0 0 10px;font-size:18px;color:var(--navy)}
input,select,textarea{font:inherit;padding:10px;border:1px solid #b9c5dd;border-radius:8px;background:#fff;user-select:text;-webkit-user-select:text;max-width:100%}
button.b{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px}
button.g{background:#e3e9f5;color:var(--navy)}button.r{background:#c0392b}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #e3e8f2}
.item .n{flex:1}.item small{color:#667}.num{width:34px;height:34px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.off{opacity:.45}
.lay{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:800px){.lay{grid-template-columns:minmax(300px,420px) 1fr}}
#pitch{position:relative;width:100%;aspect-ratio:68/100;background:repeating-linear-gradient(#2e8b3d 0 9%,#2a8039 9% 18%);border:3px solid #fff;border-radius:6px;touch-action:none;overflow:hidden}
#pitch svg{position:absolute;inset:0;width:100%;height:100%}
.tok{position:absolute;transform:translate(-50%,-50%);min-width:48px;height:48px;padding:0 6px;border-radius:24px;background:var(--navy);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:700;touch-action:none;z-index:2}
.tok i{position:absolute;top:-7px;right:-5px;font-style:normal;font-size:11px;background:#fff;color:var(--navy);border-radius:9px;padding:1px 5px}
.slot{position:absolute;transform:translate(-50%,-50%);width:40px;height:40px;border:2px dashed #fffa;border-radius:50%}
.chip{display:inline-flex;align-items:center;gap:8px;background:#e3e9f5;border-radius:24px;padding:6px 12px 6px 6px;margin:4px;touch-action:none}
#bench,.bench{min-height:60px;border:2px dashed #b9c5dd;border-radius:10px;padding:6px}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%);opacity:.9}
#lock{position:fixed;inset:0;background:linear-gradient(var(--navy),var(--navy2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;z-index:50;text-align:center;padding:20px}
#lock img{width:180px;height:180px}
#ov{position:fixed;inset:0;background:#000c;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
#ov img{max-height:78vh;max-width:100%;border-radius:8px;-webkit-user-select:auto;-webkit-touch-callout:default}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:70}
textarea{width:100%;height:110px;font-size:12px}
nav button{font-size:14px;padding:13px 2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0;text-align:center}.cal b{font-size:13px;color:#667}
.day{height:56px;border:1px solid #d3dbec;border-radius:10px;background:#fff;font-size:17px;position:relative;color:var(--tx)}
.day.today{border:2px solid var(--acc)}.day.sel{background:var(--navy);color:#fff}
.dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:4px}
i.dt,i.dm{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2e8b3d}i.dm{background:#e67e22}
.col{display:flex;flex-direction:column;gap:6px}
.vid{position:relative;aspect-ratio:16/9;max-width:560px;margin-bottom:6px}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:8px}
</style></head><body>

 const pr=$('#pitch').getBoundingClientRect();
 const inR=(r)=>e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;
 if(inR(pr)){let x=(e.clientX-pr.left)/pr.width*100,y=(e.clientY-pr.top)/pr.height*100;
  if(!m.placed[id]&&Object.keys(m.placed).length>=m.format){toast('Max '+m.format+' spelare på plan');render();return}
  x=Math.min(96,Math.max(4,x));y=Math.min(96,Math.max(4,y));
  if(m.formation!='free'){let b=null,bd=15;slots(m.format,m.formation).forEach(s=>{if(Object.entries(m.placed).some(([k,q])=>k!=id&&Math.abs(q.x-s.x)<1&&Math.abs(q.y-s.y)<1))return;const d=Math.hypot(s.x-x,(s.y-y)*1.4);if(d<bd){bd=d;b=s}});if(b){x=b.x;y=b.y}}
  m.placed[id]={x,y};save()}
 else{const el=document.elementFromPoint(e.clientX,e.clientY),b=el&&el.closest('[data-sec]');if(b){delete m.placed[id];(m.subs=m.subs||{})[id]=b.dataset.sec;save()}}
 render()});
